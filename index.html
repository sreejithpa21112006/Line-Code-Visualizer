<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Line Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Line Code Generator</h1>
      <p>Digital Communication Line Coding Waveforms</p>
    </header>

    <section class="controls">
      <label for="dataInput">Data Sequence</label>
      <input id="dataInput" type="text" value="101110" inputmode="numeric" maxlength="100">
      <button id="generateBtn">Generate Line Coding</button>
      <p id="error" class="error"></p>
    </section>

    <section class="summary">
      <div><span>Data Sequence</span><strong id="dataResult">101110</strong></div>
      <div><span>Number of Bits</span><strong id="countResult">6</strong></div>
      <div><span>Encodings</span><strong>7</strong></div>
    </section>

    <section id="charts"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
